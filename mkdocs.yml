site_name: Aria and the Curtain
site_description: Libretto + song sketches (canonical, versioned)
site_url: https://katarinarankovic.github.io/aria/

theme:
  name: material
  palette:
    scheme: default
    primary: brown
    accent: amber
  logo: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Libretto: libretto.md
  - License: license.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      
extra_css:
  - stylesheets/extra.css
